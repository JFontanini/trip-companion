<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073B5C">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Guam Coastal Circuit (v0 reference)</title>
<meta name="description" content="A full-day island drive planner from Asan, Guam: route timeline, drawn map, stop guide, seafood picks and safety.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column under a fixed bottom tab bar; the Map view becomes map + side panel at >= 980px */
:root{
  --bg:#F6F0E5; --surface:#FFFCF6; --surface-2:#EFE6D6; --ink:#1F2A30; --ink-2:#4F5E66; --line:#DCCFB7;
  --accent:#073B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEBEF; --link:#0B5A86; --focus:#16B7B0;
  --ok:#2F7A4F; --ok-bg:#E2F0E6; --warn:#8A5D00; --warn-bg:#FBF0D5; --crit:#A93820; --crit-bg:#F9E2DA; --info:#0B5A86; --info-bg:#E3F0F2;
  --c-view:#0B4F7A; --c-nature:#255A3E; --c-swim:#0B827D; --c-chamoru:#85653A; --c-spanish:#C04A2B; --c-wwii:#37474F; --c-food:#C25E16; --c-off:#9AA3A7;
  --marker-ink:#FFFFFF;
  --map-sea:#CFE7EA; --map-reef:#B2DCE0; --map-land:#EADFC8; --map-land-2:#DCCFB2; --map-coast:#86A2A9; --map-label:#5A6B72; --route:#073B5C; --route-alt:#16B7B0;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1A24; --surface:#102836; --surface-2:#163447; --ink:#E8EEF0; --ink-2:#A6B8C0; --line:#24465B;
    --accent:#64C7D1; --accent-ink:#06222F; --accent-soft:#163E4E; --link:#7FD3DC; --focus:#E9B44C;
    --ok:#7CCB98; --ok-bg:#15342A; --warn:#E9B44C; --warn-bg:#2E2610; --crit:#F2917A; --crit-bg:#3A1C15; --info:#7FD3DC; --info-bg:#12313A;
    --c-view:#74B8E6; --c-nature:#72C08E; --c-swim:#45D1C9; --c-chamoru:#D2B27E; --c-spanish:#F2917A; --c-wwii:#B7C4CA; --c-food:#F3A65C; --c-off:#5B6B73;
    --marker-ink:#06222F;
    --map-sea:#0D2C3D; --map-reef:#123B4F; --map-land:#24362F; --map-land-2:#2C4238; --map-coast:#4D7080; --map-label:#A6B8C0; --route:#64C7D1; --route-alt:#E9B44C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1A24; --surface:#102836; --surface-2:#163447; --ink:#E8EEF0; --ink-2:#A6B8C0; --line:#24465B;
  --accent:#64C7D1; --accent-ink:#06222F; --accent-soft:#163E4E; --link:#7FD3DC; --focus:#E9B44C;
  --ok:#7CCB98; --ok-bg:#15342A; --warn:#E9B44C; --warn-bg:#2E2610; --crit:#F2917A; --crit-bg:#3A1C15; --info:#7FD3DC; --info-bg:#12313A;
  --c-view:#74B8E6; --c-nature:#72C08E; --c-swim:#45D1C9; --c-chamoru:#D2B27E; --c-spanish:#F2917A; --c-wwii:#B7C4CA; --c-food:#F3A65C; --c-off:#5B6B73;
  --marker-ink:#06222F;
  --map-sea:#0D2C3D; --map-reef:#123B4F; --map-land:#24362F; --map-land-2:#2C4238; --map-coast:#4D7080; --map-label:#A6B8C0; --route:#64C7D1; --route-alt:#E9B44C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,2.9rem);letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.2rem}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0}
main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.section{display:flex;flex-direction:column;gap:14px;padding-block:22px}
.section + .section{border-top:1px solid var(--line)}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.brand span{font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:0 13px;font-size:.92rem}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{width:44px;height:44px;padding:0;border-radius:50%}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{list-style:none;margin:0 auto;padding:0 8px;max-width:760px;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabbar button{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] svg{stroke-width:2.4}

/* now bar (day-of) */
.nowbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:29;padding:0 12px 10px}
.nowbar .card{max-width:736px;margin:0 auto;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.nowbar .k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.nowbar .n{font-weight:700;font-size:1.05rem;line-height:1.2}
.nowbar .t{font-size:.9rem;opacity:.9}
.nowbar .acts{display:flex;gap:6px}
.nowbar .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.nowbar .btn.ghost{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 50%,transparent)}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:18px 8px}
.plate{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);aspect-ratio:16/8;max-width:100%}
.plate svg{display:block;width:100%;height:100%}
.plate .cap{position:absolute;right:8px;bottom:6px;font-size:.7rem;color:#fff;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:999px}
.lede{font-size:1.08rem;color:var(--ink-2);max-width:62ch}

/* controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .lbl{font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:grid;gap:6px}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center}
.seg button b{font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] span{color:inherit;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=date],input[type=time]{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.92rem;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip .sq{width:10px;height:10px;border-radius:2px;flex:none}
.chip .dm{width:9px;height:9px;transform:rotate(45deg);flex:none}
.cond{display:flex;flex-direction:column;gap:8px}
.cond label{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.cond input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fact{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.fact .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.fact .s{font-size:.82rem;color:var(--ink-2)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:6px 1fr;border-radius:12px;overflow:hidden;background:var(--info-bg)}
.alert::before{content:"";background:var(--info)}
.alert.warn{background:var(--warn-bg)}.alert.warn::before{background:var(--warn)}
.alert.crit{background:var(--crit-bg)}.alert.crit::before{background:var(--crit)}
.alert.ok{background:var(--ok-bg)}.alert.ok::before{background:var(--ok)}
.alert > div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.alert b{font-weight:700}

/* why */
details.why{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.why summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--ink-2)}
details.why[open] summary::after{content:"\2212"}
details.why .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.why ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl > li{display:grid;grid-template-columns:62px 22px 1fr;column-gap:10px}
.tl .time{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;padding-top:10px;font-size:.98rem;line-height:1.15}
.tl .time small{display:block;font-weight:400;color:var(--ink-2);font-size:.78rem}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl .node{position:relative;margin-top:10px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--marker-ink);z-index:1}
.tl .node.sq{border-radius:5px}
.tl .node.dm{border-radius:4px;transform:rotate(45deg) scale(.86)}
.tl .node.dm span{transform:rotate(-45deg)}
.tl .node.home{background:var(--ink);color:var(--bg)}
.tl .node.done{background:var(--ok)!important}
.tl .body{padding:8px 0 16px;min-width:0}
.tl .leg{grid-column:3;display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--ink-2);padding:2px 0 10px}
.tl .legrow .rail::before{background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.stopcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.stopcard.done{opacity:.72}
.stopcard h3{font-size:1.18rem}
.stopcard .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.85rem;color:var(--ink-2)}
.stopcard .acts{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.pill.ess{color:var(--accent)}
.pill.rec{color:var(--ok)}
.pill.opt{color:var(--ink-2)}
.tag{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.flag{font-size:.86rem;padding:6px 10px;border-radius:8px;background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.flag.crit{background:var(--crit-bg);border-left-color:var(--crit)}
.flag.info{background:var(--info-bg);border-left-color:var(--info)}
.skipped{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-2);font-size:.92rem}

/* stop list */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.scard .plate{border-radius:0;aspect-ratio:16/7}
.scard .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.scard .in .row:last-child{margin-top:auto}
.scard.off .plate{filter:grayscale(.7) opacity(.7)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,15,22,.5)}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{align-items:center}.sheet .box{border-radius:20px;max-height:88%}}
.sheet .head{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 10px 0}
.sheet .head .btn{background:var(--surface)}
.sheet .content{padding:0 18px;display:flex;flex-direction:column;gap:18px}
.sheet .plate{margin-top:-54px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--ink-2);font-weight:600}
.kv dd{margin:0}
.block h3{font-size:1.05rem;margin-bottom:6px;font-family:var(--f-body);font-weight:700;letter-spacing:.01em}
.block ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.navgrid .btn{border-radius:12px;min-height:52px;flex-direction:column;gap:0;font-size:.95rem}
.navgrid .btn span{font-size:.75rem;font-weight:400;color:var(--ink-2)}
.srcs{font-size:.85rem;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;padding-left:1.1em;margin:0}

/* map */
.mapwrap{display:flex;flex-direction:column;gap:12px;padding-block:12px}
.mapbox{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--map-sea);height:min(64vh,620px);touch-action:none}
#mapsvg{width:100%;height:100%;display:block;cursor:grab}
#mapsvg:active{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.mapctl .btn{width:48px;height:48px;padding:0;border-radius:12px;font-size:1.4rem;background:var(--surface)}
.maplegend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.75rem;display:flex;flex-direction:column;gap:3px;max-width:60%}
.maplegend div{display:flex;align-items:center;gap:6px}
.maplegend svg{width:14px;height:14px;flex:none}
.mk{cursor:pointer}
.mk text{font-family:var(--f-body);font-weight:700;pointer-events:none}
.drawer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.maplist{display:none}
@media (min-width:980px){
  .mapview .wrap{max-width:1240px}
  .mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  .mapbox{height:calc(100vh - 200px)}
  .mapside{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 200px);overflow:auto}
  .maplist{display:flex;flex-direction:column;gap:6px}
}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%;min-height:44px}
.mrow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* eat */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard.sel{border:2px solid var(--accent)}
.rank{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--ink-2)}
.rhead{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.fits{display:flex;flex-wrap:wrap;gap:6px}
.fit{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ink)}
.fit.no{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through}
.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numbers div{background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column}
.numbers b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.numbers span{font-size:.75rem;color:var(--ink-2)}

/* safety */
.sos{background:var(--crit-bg);border:1px solid var(--crit);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sos .num{font-family:var(--f-display);font-size:2.6rem;font-weight:600;line-height:1}
.linkgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.linkgrid{grid-template-columns:1fr 1fr}}
.linkgrid a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.linkgrid a b{color:var(--link)}
.linkgrid a span{font-size:.85rem;color:var(--ink-2)}
.list{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:6px}
.check{display:flex;flex-direction:column;gap:4px}
.check label{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* history */
.era{display:grid;grid-template-columns:86px 1fr;gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.era:first-child{border-top:0}
.era .yr{font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--accent);font-variant-numeric:tabular-nums}
.era .yr small{display:block;font-family:var(--f-body);font-weight:400;color:var(--ink-2);font-size:.78rem}
.era p{max-width:62ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 110px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem}
@media (prefers-reduced-motion:no-preference){
  .sheet .box{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

const PROFILES = {
 express:{label:"Scenic Express",range:"5 to 6 hours",desc:"Big views, four priority stops, one meal",meal:40,dinner:false},
 full:{label:"Recommended Full Day",range:"8 to 9 hours plus dinner",desc:"Major scenic and historic stops, a swim, seafood dinner",meal:50,dinner:true},

};
const DINNER_MIN = 75;

// Federal holidays when the refuge would otherwise be open (Wed to Sun) and others, 2026 to 2027
const FED_HOLIDAYS = new Set(["2026-10-12","2026-11-11","2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-10-11","2027-11-11","2027-11-25","2027-12-24"]);
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function dowOf(date){ const [y,m,d]=date.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function fmt(min){ min=Math.round(min); let h=Math.floor(min/60)%24, m=min%60; const ap=h>=12?"p.m.":"a.m."; h=h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; }
function fmtS(min){ min=Math.round(min); let h=Math.floor(min/60)%24, m=min%60; h=h%12||12; return `${h}:${String(m).padStart(2,"0")}`; }
function ap(min){ return (Math.floor(Math.round(min)/60)%24)>=12?"pm":"am"; }
function dur(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h? (m? `${h} hr ${m} min`:`${h} hr`) : `${m} min`; }
function parseHM(s){ const [h,m]=s.split(":").map(Number); return h*60+m; }

// NOAA approximation of sunset for Guam (UTC+10, no daylight saving)
function sunTimes(date, lat=13.45, lon=144.75, tz=10){
  const [y,mo,d]=date.split("-").map(Number);
  const start=Date.UTC(y,0,1), N=Math.round((Date.UTC(y,mo-1,d)-start)/864e5)+1;
  const g=2*Math.PI/365*(N-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r=Math.PI/180, la=lat*r;
  const ha=Math.acos(Math.cos(90.833*r)/(Math.cos(la)*Math.cos(dec))-Math.tan(la)*Math.tan(dec))/r;
  return { sunrise:720-4*(lon+ha)-eq+tz*60, sunset:720-4*(lon-ha)-eq+tz*60 };
}

function ritidianStatus(date, cond){
  const dw=dowOf(date);
  if(FED_HOLIDAYS.has(date)) return {open:false,why:"a federal holiday"};
  if(dw===1||dw===2) return {open:false,why:`a ${DOW[dw]}`};
  if(cond.surf) return {open:false,why: cond.surfFromLive ? "a rough-surf day in the forecast, when the refuge often closes (check its status page before you go)" : "a high surf day (the refuge closes during hazardous ocean conditions)"};
  if(cond.ritClosedLive && cond.ritClosedLive===date) return {open:false,why:"a day Fish & Wildlife lists the refuge as closed"};
  return {open:true};
}

// Shortest driving minutes on the loop plus the Route 4 cross-island link
function ring(a,b){ const d=((b-a)%L+L)%L; return d<=L-d ? {d,cw:true} : {d:L-d,cw:false}; }
function legMinutes(A,B){
  if(A.id===B.id) return {min:0,short:false,type:"ring"};
  const a=A.loop, b=B.loop;
  let best={min:ring(a,b).d,type:"ring"};
  const c1=ring(a,SHORT.a).d+SHORT.cost+ring(SHORT.b,b).d;
  const c2=ring(a,SHORT.b).d+SHORT.cost+ring(SHORT.a,b).d;
  if(c1<best.min) best={min:c1,type:"a2b"};
  if(c2<best.min) best={min:c2,type:"b2a"};
  return {min:Math.round(best.min+(A.spur||0)+(B.spur||0)), short:best.type!=="ring", type:best.type};
}

function dwellFor(s, profile, cond){
  const [lo,hi]=s.dur;
  if(s.swim && cond.water) return 15;
  const f={express:0.25,full:0.5,explorer:0.7}[profile];
  return Math.round((lo+(hi-lo)*f)/5)*5;
}

function orderKey(s,dir,lateTL){
  // With nothing else in the north on the plan, Two Lovers moves to the evening in clockwise order
  if(lateTL && s.id==="two-lovers" && dir==="cw") return L+s.loop;
  return dir==="cw" ? s.loop : ((L-s.loop)%L);
}
function dinnerId(st){ return st.dinnerForced ? st.dinner : (st.dir==="cw" ? "marina" : "fishermans"); }

function hoursFor(s, dow){
  const h=s.hours; if(!h) return null;
  if(h.byDay) return h.byDay[dow] ? {open:h.byDay[dow][0],close:h.byDay[dow][1]} : {closed:true};
  if(h.days && !h.days.includes(dow)) return {closed:true};
  return {open:h.open,close:h.close};
}

function isIncluded(s, st){
  if(s.kind==="meal") return false;
  const ov=st.overrides[s.id];
  if(st.trip && st.trip.status[s.id]==="skip") return false;
  if(ov!==undefined) return ov;
  return s.profiles.includes(st.profile);
}

// Build the plan. st = state; now = Guam minutes (for day-of mode) or null
function buildPlan(st, now){
  const dw=dowOf(st.date), sun=sunTimes(st.date), prof=PROFILES[st.profile];
  const rit=ritidianStatus(st.date, st.cond);
  const alerts=[];
  let chosen=STOPS.filter(s=>isIncluded(s,st));
  const ritWanted = chosen.some(s=>s.id==="ritidian");
  if(!rit.open){
    chosen=chosen.filter(s=>s.id!=="ritidian");
    if(ritWanted || STOPS.find(s=>s.id==="ritidian").profiles.includes(st.profile))
      alerts.push({lvl:"warn",id:"rit-closed",title:"Ritidian is off today's plan",text:`${new Date(st.date+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})} is ${rit.why}, so the refuge is closed. Pick a Wednesday to Sunday date to include it.`});
  }
  const northIds=new Set(["ritidian","spmp"]);
  const lateTL = !chosen.some(x=>northIds.has(x.id));
  const key=x=>orderKey(x,st.dir,lateTL);
  chosen.sort((a,b)=>key(a)-key(b));

  const trip=st.trip||{on:false,status:{},doneAt:{},extra:{}};
  const done = trip.on ? chosen.filter(s=>trip.status[s.id]==="done") : [];

  function simulate(list, startMin, from){
    const items=[]; let t=startMin, pos=from, drive=0;
    for(const s of list){
      const leg=legMinutes(pos,s);
      drive+=leg.min; t+=leg.min;
      const dwell=(s._meal? s._mealDwell : dwellFor(s,st.profile,st.cond)) + ((trip.extra||{})[s.id]||0);
      items.push({s,leg,arrive:t,depart:t+dwell,dwell}); t+=dwell; pos=s;
    }
    return {items,t,pos,drive};
  }

  const startMin=parseHM(st.start);
  const remaining=chosen.filter(s=>!(trip.on && trip.status[s.id]==="done"));
  let fromPos=HOME, t0=startMin;
  if(trip.on){
    const last=trip.last? (STOPS.find(s=>s.id===trip.last)||RESTAURANTS.find(r=>r.id===trip.last)) : null;
    if(last) fromPos=last;
    if(now!=null) t0=Math.max(now, startMin);
  }
  const order=list=>rotateFrom([...list].sort((a,b)=>key(a)-key(b)), fromPos, key);

  // dinner wanted?
  let dId=dinnerId(st);
  const wantDinner = dId!=="none" && (prof.dinner || st.dinnerForced) && !(trip.on && trip.dinnerDone);

  // lunch: pick the candidate that lands nearest 12:15
  const lunchCands=[STOPS.find(s=>s.id==="jeffs"), RESTAURANTS.find(r=>r.id==="marina")];
  let lunch=null, lunchArr=null;
  if(!(trip.on && trip.lunchDone)){
    const scored=lunchCands.map(c=>{
      const m=Object.assign({},c,{_meal:true,_mealDwell:prof.meal,cats:["seafood"],kind:"meal"});
      const sim=simulate(order([...remaining,m]), t0, fromPos);
      const it=sim.items.find(i=>i.s===m);
      const late=it.arrive>14*60+30, early=it.arrive<10*60+45;
      return {m,arrive:it.arrive,score:Math.abs(it.arrive-(12*60+15))+(early?120:0)+(late?120:0)};
    }).sort((x,y)=>x.score-y.score);
    let pick=scored[0];
    if(wantDinner && pick.m.id===dId){
      const alt=scored.find(x=>x.m.id!==dId && x.arrive>=10*60+45 && x.arrive<=14*60+30);
      if(alt) pick=alt;
      else if(!st.dinnerForced){
        const fall=(st.dir==="cw"?["crab","beachin","fishermans"]:["fishermans","beachin","crab"]).find(x=>x!==pick.m.id);
        alerts.push({lvl:"info",id:"dinner-moved",title:`Dinner moved to ${RESTAURANTS.find(r=>r.id===fall).name}`,text:`Lunch works out best at ${pick.m.name} today, so dinner goes somewhere else. Change it under Eat.`});
        dId=fall;
      } else alerts.push({lvl:"info",id:"same-place",title:"Lunch and dinner at the same place",text:`Both meals land at ${pick.m.name}. Pick another dinner under Eat if you want variety.`});
    }
    // past mid-afternoon in day-of mode, skip lunch
    if(!(trip.on && t0>14*60)) { lunch=pick.m; lunchArr=pick.arrive; }
  }
  const sim=simulate(order(lunch?[...remaining,lunch]:remaining), t0, fromPos);

  let dinner=null, dinnerItem=null, homeLeg, endT=sim.t, drive=sim.drive;
  if(wantDinner){
    const r=RESTAURANTS.find(x=>x.id===dId)||RESTAURANTS[0];
    const leg=legMinutes(sim.pos,r);
    const raw=sim.t+leg.min;
    const floor=Math.max(17*60+30, r.hours? r.hours.open : 0);
    const arrive=Math.max(raw,floor);
    dinner=r; dinnerItem={s:r,leg,arrive,depart:arrive+DINNER_MIN,dwell:DINNER_MIN,spare:arrive-raw,spareAt:sim.t};
    drive+=leg.min; endT=arrive+DINNER_MIN;
    homeLeg=legMinutes(r,HOME);
  }
  if(!homeLeg) homeLeg=legMinutes(sim.pos,HOME);
  drive+=homeLeg.min; const homeT=endT+homeLeg.min;

  // per-item warnings
  for(const it of sim.items){
    it.flags=[];
    const s=it.s;
    if(s.id==="ritidian"){
      if(it.arrive>15*60+30) it.flags.push({lvl:"crit",t:`Arrives ${fmt(it.arrive)}. The gate closes at 4:00 p.m., so this would be a very short visit at best.`});
      else if(it.depart>16*60) it.flags.push({lvl:"warn",t:`The gate closes at 4:00 p.m., leaving about ${dur(16*60-it.arrive)} here.`});
      if(s.status) it.flags.push({lvl:"info",t:s.status});
    }
    if(s.id==="two-lovers" && it.arrive<600) it.flags.push({lvl:"info",t:`Arrives ${fmt(it.arrive)}. The lookout may not be open yet (listings say 7 or 10 a.m.). The grounds are still worth a look, or come back at sunset.`});
    if(s.id==="inalahan-village"){
      if(it.arrive>=720) it.flags.push({lvl:"info",t:`Gef Pa'go demonstrations end at noon; you arrive about ${fmt(it.arrive)}. Walk the village instead, or plan a southern morning another day.`});
      else it.flags.push({lvl:"info",t:`You arrive before noon, in time for Gef Pa'go's 9 a.m. to noon demonstrations.`});
    }
    if(s.swim && st.cond.water) it.flags.push({lvl:"warn",t:"Water-quality advisory set. Treat this as a scenic stop and stay out of the water."});
    if(s.swim && st.cond.surf) it.flags.push({lvl:"warn",t:"High surf: watch for surge over the rocks before going in."});
    if(s.checkSameDay) it.flags.push({lvl:"info",t:"Check same-day availability, ticketing and operating conditions."});
    const h=s.hours? hoursFor(s,dw):null;
    if(h && h.closed && s.id!=="ritidian") it.flags.push({lvl:"warn",t:`Reported closed on ${DOW[dw]}s.`});
    if(h && !h.closed && s.id!=="inalahan-village" && s.id!=="two-lovers" && s.id!=="ritidian" && (it.arrive<h.open||it.arrive>h.close-20)) it.flags.push({lvl:"warn",t:`Arrives ${fmt(it.arrive)}, outside reported hours (${fmt(h.open)} to ${fmt(h.close)}).`});
    if(!s._meal && s.cats.includes("viewpoint") && it.arrive>sun.sunset-10) it.flags.push({lvl:"warn",t:`Arrives after sunset (${fmt(sun.sunset)}). The view will be gone.`});
  }
  if(dinnerItem){
    dinnerItem.flags=[];
    const h=dinner.hours;
    if(h && dinnerItem.arrive<h.open) dinnerItem.flags.push({lvl:"info",t:`You would arrive ${fmt(dinnerItem.arrive)}; dinner service is reported to start at ${fmt(h.open)}.`});
    if(h && dinnerItem.arrive>h.close-45) dinnerItem.flags.push({lvl:"warn",t:`Arrives ${fmt(dinnerItem.arrive)}, close to the reported closing time.`});
    if(!h) dinnerItem.flags.push({lvl:"info",t:dinner.hoursNote});
  }

  // plan-level alerts
  const ritItem=sim.items.find(i=>i.s.id==="ritidian");
  if(ritItem && ritItem.arrive>14*60+50) alerts.push({lvl:"crit",id:"rit-late",title:"Ritidian comes too late in this direction",text:`You would reach the refuge at ${fmt(ritItem.arrive)}, and it closes at 4:00 p.m. Drive clockwise to arrive in the morning, or save Ritidian for a north-coast day.`,action:st.dir==="ccw"?{label:"Switch to clockwise",fn:"setDir",arg:"cw"}:null});
  const late=sim.items.filter(i=>!i.s._meal && i.arrive>sun.sunset-10 && i.s.cats.some(c=>c==="viewpoint"||c==="swimming"));
  if(late.length) alerts.push({lvl:"warn",id:"dark",title:trip.on?"Prioritize the south today":"Not enough daylight for every stop",text:`${late.map(i=>i.s.short_name||i.s.name).join(", ")} would come after sunset (${fmt(sun.sunset)}). Trim optional stops to keep the essentials in daylight.`,action:{label:"Trim to essentials",fn:"trim"}});
  if(homeT>21*60) alerts.push({lvl:"warn",id:"long",title:"A long day",text:`Projected return is ${fmt(homeT)}. Consider Scenic Express or skipping a stop.`});
  if(st.cond.rain) alerts.push({lvl:"info",id:"rain",title:st.cond.rainFromLive?"Rain likely this afternoon (forecast)":"Rain likely this afternoon",text:"Prioritize overlooks and historic sites before any swimming stop. Pools turn murky after heavy runoff, and Cetti Bay loses its view in cloud."});
  if(st.cond.water) alerts.push({lvl:"warn",id:"water",title:"Water-quality advisory",text:"Keep Inalåhan as a scenic stop, but do not plan to enter the water. The plan shortens that stop to 15 minutes."});
  if(st.cond.surf) alerts.push({lvl:"warn",id:"surf",title:st.cond.surfFromLive?"Rough surf in the forecast":"High surf advisory",text:"Ritidian closes in hazardous ocean conditions, so it is off the plan. Skip pier jumping at Malesso' and watch for surge at the pools."});
  if(dw===3) alerts.push({lvl:"ok",id:"wed",title:"It's a Wednesday",text:"Chamorro Village in Hagåtña holds its night market from 5:30 to 9:30 p.m., with barbecue, local produce, crafts and dancing. It is 10 minutes from Oceanview Drive if you want to end the day there."});

  return {items:sim.items, dinnerItem, dinnerId:dinner?dinner.id:null, homeLeg, homeT, endT, drive, sun, rit, alerts, lunch, t0, fromPos, done, lateTL};
}

// Rotate a sorted list so the first element is the next stop after `from` in travel order
function rotateFrom(list, from, key){
  if(!from || from.id==="home") return list;
  const inList=list.some(s=>s.id===from.id);
  const k = inList ? key(list.find(s=>s.id===from.id)) : key(from);
  const after=list.filter(s=>key(s)>k && s.id!==from.id), before=list.filter(s=>key(s)<=k && s.id!==from.id);
  return [...after,...before];
}

// Restaurant ranking for the Eat tab
function rankDinner(st, plan){
  const mood=st.mood;
  const lastPos = plan.items.length? plan.items[plan.items.length-1].s : HOME;
  const directHome = legMinutes(lastPos,HOME).min;
  return RESTAURANTS.map(r=>{
    const toR=legMinutes(lastPos,r).min, toHome=legMinutes(r,HOME).min;
    let score=0;
    if(r.moods.includes(mood)) score+=10;
    if(mood==="grilled"){ score+= (r.fits.grilled?4:0)+(r.fits.lowCarb?2:0)+(r.fits.sashimi?1:0); }
    if(mood==="quick") score+= Math.max(0,30-toHome);
    if(mood==="refined" && r.price==="$$$$") score+=5;
    score += Math.max(0, 12-(toR+toHome-directHome)/3);
    return {r,toR,toHome,extra:toR+toHome-directHome,score};
  }).sort((a,b)=>b.score-a.score);
}

function priPill(s){ if(s.kind==="meal") return `<span class="pill rec">Lunch</span>`; if(s.detour) return `<span class="pill opt">Optional detour</span>`; return {essential:`<span class="pill ess">Essential</span>`,recommended:`<span class="pill rec">Recommended</span>`,optional:`<span class="pill opt">Optional</span>`}[s.priority]; }
function flagsHtml(f){ return (f||[]).map(x=>`<div class="flag ${x.lvl==="crit"?"crit":x.lvl==="info"?"info":""}">${esc(x.t)}</div>`).join(""); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

let PLAN=null;
function computePlan(){
  const now = (st.trip.on && st.date===guamNow().date) ? guamNow().min : (st.trip.on ? null : null);
  PLAN=buildPlan(st, st.trip.on ? (now ?? parseHM(st.start)) : null);
  let n=0; for(const it of PLAN.items){ if(!it.s._meal) stopNumber[it.s.id]=++n; }
}

function nodeHtml(s,num){
  if(s._meal||s.kind==="meal") return `<div class="node dm" style="background:${catColor("seafood")}"><span>${s._meal?"L":"D"}</span></div>`;
  const sh=shapeOf(s);
  return `<div class="node ${sh==="s"?"sq":sh==="d"?"dm":""}" style="background:${catColor(primaryCat(s))}"><span>${num}</span></div>`;
}
function legRow(leg){
  if(!leg||!leg.min) return "";
  return `<li class="legrow"><div></div><div class="rail"></div><div class="leg">${I.car}<span>${dur(leg.min)} drive${leg.short?" · Route 4 cross-island":""}</span></div></li>`;
}
function timeline(){
  const p=PLAN; let h=`<ol class="tl">`;
  // start
  const startLabel = st.trip.on ? (st.trip.last? "Now, at "+(byId(st.trip.last).short_name||byId(st.trip.last).name) : "Now, at Oceanview Drive") : "Oceanview Drive, Asan";
  h+=`<li><div class="time">${fmtS(st.trip.on?p.t0:parseHM(st.start))}<small>${ap(st.trip.on?p.t0:parseHM(st.start))}</small></div><div class="rail"><div class="node home"><span>H</span></div></div><div class="body"><div class="stopcard"><h3>${esc(startLabel)}</h3>${st.trip.on?"":`<p class="small muted">Fill water bottles, check fuel (keep it above a quarter tank in the south and north), and check the weather and beach advisories before you go.</p>`}</div></div></li>`;

    for(const id of Object.keys(st.trip.status).filter(k=>st.trip.status[k]==="done")){

    }
  }

    h+=legRow(it.leg);
    const s=it.s, num=stopNumber[s.id];
    const isMeal=!!s._meal;
    h+=`<li><div class="time">${fmtS(it.arrive)}<small>${ap(it.arrive)} · ${dur(it.dwell)}</small></div><div class="rail">${nodeHtml(s,num)}</div><div class="body"><article class="stopcard">
      <div class="row">${isMeal?`<span class="pill rec">Lunch</span>`:priPill(s)}<span class="small muted">${esc(isMeal?(s.area||s.village):s.village)}</span></div>
      <h3>${esc(isMeal?s.name:(s.short_name||s.name))}</h3>
      <p class="small">${esc(s.short)}</p>
      ${isMeal?`<p class="small"><b>Order:</b> ${esc((s.orders||[s.practical&&s.practical[0]]).filter(Boolean)[0]||"")}</p>`:""}
      ${flagsHtml(it.flags)}
      <div class="acts">
        <button class="btn sm" data-act="nav" data-arg="${s.id}">${I.nav} Navigate</button>
        ${isMeal?"":`<button class="btn sm" data-act="detail" data-arg="${s.id}">Details</button>`}
        ${st.trip.on?`<button class="btn sm primary" data-act="done" data-arg="${isMeal?"lunch:"+s.id:s.id}">${I.check} Done</button><button class="btn sm ghost" data-act="stay" data-arg="${s.id}">Stay +15</button>`:""}
        ${isMeal?"":`<button class="btn sm ghost" data-act="skip" data-arg="${s.id}">Skip</button>`}

      <h3>${esc(r.name)}</h3><p class="small">${esc(r.short)}</p>

  }
  h+=legRow(p.homeLeg);
  h+=`<li><div class="time">${fmtS(p.homeT)}<small>${ap(p.homeT)}</small></div><div class="rail"><div class="node home"><span>H</span></div></div><div class="body"><div class="stopcard"><h3>Back at Oceanview Drive</h3><p class="small muted">${p.homeT<p.sun.sunset?"Home before sunset at "+fmt(p.sun.sunset)+".":"After dark. The last stretch is the familiar Marine Corps Drive corridor."}</p></div></div></li>`;
  h+=`</ol>`;
  // skipped / not included
  const off=STOPS.filter(s=>s.kind!=="meal" && !PLAN.items.some(i=>i.s.id===s.id) && !(st.trip.on&&st.trip.status[s.id]==="done"));

      const closed = s.id==="ritidian" && !PLAN.rit.open;
      return `<div class="skipped"><span><b>${esc(s.short_name||s.name)}</b> · ${closed?"closed today":s.detour?"optional detour":esc(PRI_LABEL[s.priority])}</span>${closed?"":`<button class="btn sm" data-act="add" data-arg="${s.id}">Add</button>`}</div>`;}).join("")}</div>`;
  }
  return h;
}
function spareRow(it){
  const last=PLAN.items.length? PLAN.items[PLAN.items.length-1].s : HOME;
  const toHome=legMinutes(last,HOME).min;
  let tip;
  if(it.spare>=100 && toHome<=30) tip=`Oceanview Drive is ${dur(toHome)} away. Go back to rest and change, then head out to dinner.`;
  else if(it.s.area==="Agat") tip="Linger at Ga'an Point's beach or walk the Agat Marina breakwater as the light drops.";
  else if(it.s.area==="Tumon") tip=`Walk the Tumon Bay beach path, or catch sunset (${fmt(PLAN.sun.sunset)}) from Two Lovers Point.`;
  else tip="Walk Paseo de Susana and the old Plaza de España area in Hagåtña.";
  return `<li><div class="time">${fmtS(it.spareAt)}<small>${ap(it.spareAt)}</small></div><div class="rail"><div class="node" style="background:var(--surface-2);color:var(--ink)"><span>·</span></div></div><div class="body"><div class="skipped" style="border-style:solid;display:block"><b>Time to spare: ${dur(it.spare)}</b><br><span class="small">${esc(tip)}</span></div></div></li>`;
}
const PRI_LABEL={essential:"essential",recommended:"recommended",optional:"optional"};

function cutList(){
  if(st.trip.on) return "";
  const inc=PLAN.items.filter(i=>!i.s._meal);
  if(inc.length<4) return "";
  const intr=new Set(st.interests);
  const score=s=>({essential:5,recommended:3,optional:0}[s.priority]) + s.cats.reduce((a,c)=>a+((intr.has("history")&&HISTORY_CATS.includes(c))?2:0)+((intr.has("nature")&&(c==="nature"||c==="viewpoint"))?2:0)+((intr.has("swimming")&&c==="swimming")?2:0),0);
  const list=inc.map(i=>({s:i.s,score:score(i.s),save:i.dwell+2*(i.s.spur||0)})).filter(x=>x.s.priority!=="essential").sort((a,b)=>a.score-b.score).slice(0,3);
  if(!list.length) return "";
  return `<section class="section"><h2>If the day runs long</h2><p class="muted small">Cut these first, ranked by priority and your interests.</p>
   <div class="chips" role="group" aria-label="Interests">${[["history","History"],["nature","Nature"],["swimming","Swimming"],["seafood","Seafood"]].map(([k,l])=>`<button class="chip" aria-pressed="${intr.has(k)}" data-act="interest" data-arg="${k}">${l}</button>`).join("")}</div>
   <ol class="list">${list.map(x=>`<li><b>${esc(x.s.short_name||x.s.name)}</b> saves about ${dur(x.save)}</li>`).join("")}</ol></section>`;
}

const K=1000, COS=Math.cos(13.45*Math.PI/180), LON0=144.60, LAT0=13.68;
const P=(lat,lon)=>[(lon-LON0)*K*COS,(LAT0-lat)*K];
const OUTLINE=[[144.8852,13.6409],[144.896,13.6172],[144.914,13.6054],[144.9356,13.6004],[144.9536,13.5987],[144.9536,13.5868],[144.9392,13.5598],[144.9068,13.5159],[144.8708,13.4855],[144.8096,13.445],[144.7844,13.4197],[144.77,13.3792],[144.7592,13.2863],[144.734,13.2491],[144.7196,13.2424],[144.698,13.2407],[144.68,13.2474],[144.6692,13.2643],[144.6584,13.2812],[144.6548,13.2863],[144.6476,13.3251],[144.644,13.3319],[144.6404,13.3369],[144.6332,13.342],[144.626,13.3454],[144.6368,13.3555],[144.644,13.3656],[144.6476,13.3792],[144.6476,13.396],[144.644,13.4045],[144.6404,13.4146],[144.6332,13.4231],[144.6224,13.4315],[144.6296,13.4383],[144.6368,13.4433],[144.6404,13.4383],[144.6548,13.4399],[144.716,13.4737],[144.7304,13.4855],[144.7844,13.5159],[144.7952,13.5277],[144.8024,13.5396],[144.8096,13.5531],[144.8312,13.6206],[144.8384,13.6324],[144.8492,13.6443],[144.8672,13.6527],[144.8816,13.6544]];
function smoothClosed(pts){
  const n=pts.length; let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n;i++){ const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; }
  return d+"Z";
}
function loopPoint(m){
  m=((m%L)+L)%L;
  for(let i=0;i<NODES.length-1;i++){ const a=NODES[i],b=NODES[i+1]; if(m>=a[0]&&m<=b[0]){ const t=(m-a[0])/((b[0]-a[0])||1); return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; } }
  return [NODES[0][1],NODES[0][2]];
}
function legPath(A,B,leg){
  const pts=[[A.lat,A.lon]];
  const walk=(from,to)=>{ const r=ring(from,to); for(let k=2;k<r.d;k+=2) pts.push(loopPoint(r.cw?from+k:from-k)); pts.push(loopPoint(to)); };
  pts.push(loopPoint(A.loop));
  if(leg.type==="a2b"){ walk(A.loop,SHORT.a); SHORT.via.forEach(v=>pts.push(v)); walk(SHORT.b,B.loop); }
  else if(leg.type==="b2a"){ walk(A.loop,SHORT.b); [...SHORT.via].reverse().forEach(v=>pts.push(v)); walk(SHORT.a,B.loop); }
  else walk(A.loop,B.loop);
  pts.push([B.lat,B.lon]);
  return pts;
}
let mapVB={x:-10,y:-10,w:380,h:480};
function mapSvg(){
  const p=PLAN;
  const land=smoothClosed(OUTLINE.map(([lon,lat])=>P(lat,lon)));
  const layers=new Set(st.layers);
  const visible=s=>!layers.size || (s.cats||[]).some(c=>layers.has(c)||(layers.has("history")&&HISTORY_CATS.includes(c))) || (layers.has("seafood")&&s.kind==="meal");
  // route
  let route=""; const seq=[HOME,...p.items.map(i=>i.s),...(p.dinnerItem?[p.dinnerItem.s]:[]),HOME];
  if(st.trip.on && st.trip.last){ seq[0]=byId(st.trip.last)||HOME; }
  const legs=[...p.items.map(i=>i.leg),...(p.dinnerItem?[p.dinnerItem.leg]:[]),p.homeLeg];
  let all=[];
  for(let i=0;i<seq.length-1;i++){ const lp=legPath(seq[i],seq[i+1],legs[i]); all=all.concat(lp.slice(i?1:0)); }
  const rd=all.map(([la,lo],i)=>{ const [x,y]=P(la,lo); return (i?"L":"M")+x.toFixed(1)+","+y.toFixed(1); }).join("");
  route=`<path d="${rd}" fill="none" stroke="var(--surface)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/><path d="${rd}" fill="none" stroke="var(--route)" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round" marker-mid="url(#arw)"/>`;
  // detour stops not included: dashed spur lines
  let off="";
  for(const s of STOPS){ if(p.items.some(i=>i.s.id===s.id)) continue; if(!visible(s)) continue;
    const base=loopPoint(s.loop), [x1,y1]=P(base[0],base[1]), [x2,y2]=P(s.lat,s.lon);
    off+=`<path d="M${x1},${y1} L${x2},${y2}" stroke="var(--c-off)" stroke-width="2" stroke-dasharray="4 4" fill="none"/>`; }
  // labels
  const LBL=[["Philippine Sea",13.50,144.635,1],["Pacific Ocean",13.33,144.86,1],["Hagåtña",13.488,144.745],["Tumon",13.523,144.786],["Yigo",13.555,144.905],["Andersen AFB (no access)",13.592,144.912],["Apra Harbor",13.447,144.648],["Hågat",13.381,144.672],["Humåtak",13.300,144.672],["Malesso'",13.252,144.688],["Inalåhan",13.284,144.735],["Talo'fo'fo",13.352,144.748],["Yona",13.412,144.763],["Mangilao",13.462,144.828],["Mt. Lamlam",13.336,144.672]];
  let lbl=LBL.map(([t,la,lo,sea])=>{ const [x,y]=P(la,lo); return `<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-size="${sea?10:7.5}" ${sea?'font-style="italic" letter-spacing="1"':''} fill="var(--map-label)" text-anchor="middle" style="font-family:var(--f-body)">${t}</text>`; }).join("");
  // markers
  let mk="";
  const drawMarker=(s,num,inPlan)=>{
    const [x,y]=P(s.lat,s.lon); const sh=s.kind==="meal"?"d":shapeOf(s);
    const col=inPlan? catColor(s.kind==="meal"?"seafood":primaryCat(s)) : "var(--c-off)";
    const sel=st.selected===s.id; const r=sel?10:8;
    let shape = sh==="s" ? `<rect x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" rx="3"/>` : sh==="d" ? `<rect x="${-r*.85}" y="${-r*.85}" width="${1.7*r}" height="${1.7*r}" rx="2" transform="rotate(45)"/>` : `<circle r="${r}"/>`;
    shape=shape.replace("/>",` fill="${col}" stroke="var(--surface)" stroke-width="${sel?3:2}"/>`);
    const label = s.kind==="meal" ? "L" : (inPlan&&num? num : "+");
    return `<g class="mk" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc((s.short_name||s.name)+(inPlan?", stop "+num:", not on plan"))}" data-sel="${s.id}">${sel?`<circle r="16" fill="var(--route-alt)" opacity=".28"/>`:""}${shape}<text y="3.3" font-size="${sel?10:8.5}" text-anchor="middle" fill="var(--marker-ink)">${label}</text></g>`;
  };
  for(const s of STOPS){ if(!visible(s)) continue; const inPlan=p.items.some(i=>i.s.id===s.id); if(s.kind==="meal" && !inPlan) continue; mk+=drawMarker(s,stopNumber[s.id],inPlan); }
  if(!layers.size||layers.has("seafood")) for(const r of RESTAURANTS){ const inPlan=(p.dinnerItem&&p.dinnerItem.s.id===r.id)||(p.lunch&&p.lunch.id===r.id); if(!inPlan) continue; const [x,y]=P(r.lat,r.lon); mk+=`<g class="mk" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(r.name)}, ${p.lunch&&p.lunch.id===r.id?"lunch":"dinner"}" data-sel="${r.id}"><rect x="-7" y="-7" width="14" height="14" rx="2" transform="rotate(45)" fill="var(--c-food)" stroke="var(--surface)" stroke-width="2"/><text y="3.3" font-size="8.5" text-anchor="middle" fill="var(--marker-ink)">${p.lunch&&p.lunch.id===r.id?"L":"D"}</text></g>`; }
  const [hx,hy]=P(HOME.lat,HOME.lon);
  mk+=`<g class="mk" transform="translate(${hx},${hy})" data-sel="home" tabindex="0" role="button" aria-label="Start: Oceanview Drive, Asan"><path d="M0,-11 L3,-3 L11,-3 L4.5,2 L7,10 L0,5 L-7,10 L-4.5,2 L-11,-3 L-3,-3Z" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.5"/></g><text x="${hx-14}" y="${hy+4}" font-size="8" text-anchor="end" font-weight="700" fill="var(--ink)" style="font-family:var(--f-body)">Oceanview Dr</text>`;
  // compass + scale
  const sb=5/111.32*K;
  const deco=`<g transform="translate(330,24)"><path d="M0,-12 L5,4 L0,0 L-5,4Z" fill="var(--ink)"/><text y="16" font-size="8" text-anchor="middle" fill="var(--ink)" font-weight="700">N</text></g>
   <g transform="translate(14,448)"><path d="M0,0 h${sb.toFixed(1)}" stroke="var(--ink)" stroke-width="2"/><path d="M0,-3 v6 M${sb.toFixed(1)},-3 v6" stroke="var(--ink)" stroke-width="1.5"/><text x="${(sb/2).toFixed(0)}" y="-5" font-size="7.5" text-anchor="middle" fill="var(--ink)">5 km</text></g>`;
  return `<svg id="mapsvg" viewBox="${mapVB.x} ${mapVB.y} ${mapVB.w} ${mapVB.h}" role="img" aria-label="Drawn map of Guam showing today's route and numbered stops. The route list on the Route tab carries the same information.">
   <defs><marker id="arw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="var(--route)" stroke-width="2"/></marker></defs>
   <rect x="-400" y="-400" width="1200" height="1300" fill="var(--map-sea)"/>
   <path d="${land}" fill="none" stroke="var(--map-reef)" stroke-width="12" stroke-linejoin="round"/>
   <path d="${land}" fill="var(--map-land)" stroke="var(--map-coast)" stroke-width="1.2"/>
   ${lbl}${off}${route}${mk}${deco}</svg>`;
}

// ---------- HISTORY ----------
function historyHtml(){
  const eras=[
    ["c. 1500 BC","Ancient CHamoru","Long before European contact, CHamoru people built village communities across Guam and the Mariana Islands. Latte stones, pillar-and-capstone foundations of houses, remain the most visible symbol of that legacy. You will see that world at Ritidian, Cetti Bay and Pago Bay."],
    ["1521 · 1668","Spanish era","Magellan's ships reached Guam in 1521, and Spain claimed the island in 1565. Permanent colonial rule began with the Jesuit mission of 1668, followed by decades of war, disease and forced resettlement into church-centered villages such as Inalåhan. Humåtak Bay served Manila galleons until 1815, guarded by Fort Soledad and three other forts."],
    ["1898","American naval era","Spain ceded Guam to the United States after the Spanish-American War. The U.S. Navy governed the island for most of the next half century."],
    ["1941 to 1944","Japanese occupation and WWII","Japan occupied Guam from December 1941 to July 1944, 31 months marked by forced labor, internment and killings of CHamoru civilians. U.S. forces landed at Asan and Agat on July 21, 1944, now Liberation Day. The last organized fighting came at Mataguac in Yigo that August."],
    ["1950 to today","Contemporary Guam","The Organic Act of 1950 made Guam an unincorporated U.S. territory and its people U.S. citizens. Guam is the largest and southernmost of the Mariana Islands, and CHamoru language, food, fiestas and family networks remain central to its identity."]
  ];
  const all=Object.values(S);
  return `<div class="head"><button class="btn iconbtn" data-act="close" aria-label="Close">✕</button></div>
   <div class="content"><span class="eyebrow">About Guam</span><h2 id="sheetTitle" style="font-size:1.9rem">Guam in Layers: CHamoru, Spanish, Japanese, American</h2>
   <div>${eras.map(([y,t,p])=>`<div class="era"><div class="yr">${y}<small>${t}</small></div><p>${esc(p)}</p></div>`).join("")}</div>
   <p class="small muted">The era summaries draw on general reference history; stop-specific claims carry their own sources below.</p>
   <div class="block"><h3>All sources (accessed ${ACCESSED})</h3><ol class="srcs">${all.map(x=>`<li><a href="${x.u}" target="_blank" rel="noopener">${esc(x.t)}</a>, ${esc(x.p)} <span>(${x.c})</span></li>`).join("")}</ol></div>
   </div>`;
}

// ---------- nav chooser ----------
function navHtml(p){
  const l=navLinks(p);
  return `<div class="head"><button class="btn iconbtn" data-act="close" aria-label="Close">✕</button></div><div class="content"><h2 id="sheetTitle">Navigate to ${esc(p.short_name||p.name)}</h2>
  <div class="navgrid"><a class="btn" href="${l.google}" target="_blank" rel="noopener">Google<span>Maps</span></a><a class="btn" href="${l.apple}" target="_blank" rel="noopener">Apple<span>Maps</span></a><a class="btn" href="${l.waze}" target="_blank" rel="noopener">Waze<span>Navigate</span></a></div>
  <p class="small muted">Opens your maps app searching for "${esc(p.q)}". Pins on this page are approximate.</p></div>`;
}
function openSheet(html){ const sh=$("#sheet"); sh.innerHTML=`<div class="box">${html}</div>`; sh.hidden=false; const b=sh.querySelector("[data-act=close]"); b&&b.focus(); }
function closeSheet(){ $("#sheet").hidden=true; $("#sheet").innerHTML=""; }

// ---------- now bar ----------
function renderNow(){
  const nb=$("#nowbar");
  if(!st.trip.on){ nb.hidden=true; return; }
  const next=PLAN.items[0] || PLAN.dinnerItem;
  if(!next){ nb.hidden=false; nb.innerHTML=`<div class="card"><div><div class="k">All stops done</div><div class="n">Head home</div><div class="t">${dur(PLAN.homeLeg.min)} to Oceanview Drive</div></div><div class="acts"><button class="btn sm" data-act="nav" data-arg="home">Navigate</button></div></div>`; return; }
  const s=next.s; const isDinner=PLAN.dinnerItem&&next===PLAN.dinnerItem;
  nb.hidden=false;
  nb.innerHTML=`<div class="card"><div style="min-width:0"><div class="k">Next stop${s._meal?" · lunch":isDinner?" · dinner":""}</div><div class="n">${esc(s.short_name||s.name)}</div><div class="t tnum">Arrive ~${fmt(next.arrive)} · ${dur(next.leg.min)} drive</div></div>
   <div class="acts"><button class="btn sm" data-act="nav" data-arg="${s.id}">${I.nav}<span class="sr">Navigate</span></button><button class="btn sm ghost" data-act="done" data-arg="${s._meal?"lunch:"+s.id:isDinner?"dinner:"+s.id:s.id}">Done</button></div></div>`;
}

// ---------- render ----------
function render(){
  computePlan();
  const d=new Date(st.date+"T12:00:00");
  $("#hdrSub").textContent=`${PROFILES[st.profile].label} · ${st.dir==="cw"?"clockwise":"south first"} · ${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}`;
  $("#tabs").innerHTML=TABS.map(([k,l,ic])=>`<li><button type="button" data-act="tab" data-arg="${k}" ${st.tab===k?'aria-current="page"':""}>${ic}<span>${l}</span></button></li>`).join("");
  const v={route:viewRoute,map:viewMap,stops:viewStops,eat:viewEat,safety:viewSafety}[st.tab]||viewRoute;
  $("#main").innerHTML=v();
  renderNow();
  if(st.tab==="map") bindMap();
}

// ---------- events ----------
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-sel]"); if(!el) return;
  if(el.dataset.sel && !el.dataset.act){ if(dragMoved) return; st.selected=el.dataset.sel; save(); if(st.tab==="map"){ render(); } return; }
  const a=el.dataset.act, arg=el.dataset.arg;
  switch(a){
    case "tab": st.tab=arg; save(); render(); window.scrollTo(0,0); break;
    case "profile": set({profile:arg}); break;
    case "setDir": set({dir:arg}); toast(arg==="cw"?"Clockwise: north first":"South first"); break;
    case "interest": { const s=new Set(st.interests); s.has(arg)?s.delete(arg):s.add(arg); set({interests:[...s]}); break; }
    case "layer": { const s=new Set(st.layers); s.has(arg)?s.delete(arg):s.add(arg); set({layers:[...s]}); break; }
    case "layerclear": set({layers:[]}); break;
    case "detail": openSheet(detailHtml(byId(arg))); break;
    case "nav": openSheet(navHtml(arg==="home"?HOME:byId(arg))); break;
    case "close": closeSheet(); break;
    case "history": openSheet(historyHtml()); break;
    case "skip": { st.overrides[arg]=false; save(); closeSheet(); render(); toast("Skipped. Find it under Not on today's plan."); break; }
    case "add": { st.overrides[arg]=true; if(st.trip.on) delete st.trip.status[arg]; save(); closeSheet(); render(); toast("Added to your day"); break; }
    case "trim": { for(const it of PLAN.items){ if(!it.s._meal && it.s.priority!=="essential") st.overrides[it.s.id]=false; } save(); render(); toast("Trimmed to essential stops"); break; }
    case "mood": set({mood:arg}); break;
    case "dinner": set({dinner:arg,dinnerForced:true}); toast("Dinner set"); break;
    case "dinnerOn": set({dinner:dinnerId(Object.assign({},st,{dinnerForced:false})),dinnerForced:true}); break;
    case "dinnerOff": set({dinner:"none",dinnerForced:true}); break;
    case "startTrip": { const n=guamNow(); st.trip={on:true,status:{},doneAt:{},extra:{},last:null,lunchDone:false,dinnerDone:false}; if(st.date!==n.date){ st.date=n.date; toast("Plan moved to today"); } st.tab="route"; save(); render(); window.scrollTo(0,0); break; }
    case "endTrip": st.trip={on:false,status:{},doneAt:{},extra:{},last:null,lunchDone:false,dinnerDone:false}; save(); render(); break;
    case "done": {
      const n=guamNow().min;
      if(arg.startsWith("lunch:")){ st.trip.lunchDone=true; st.trip.last=arg.slice(6); }
      else if(arg.startsWith("dinner:")){ st.trip.dinnerDone=true; st.trip.last=arg.slice(7); }
      else { st.trip.status[arg]="done"; st.trip.doneAt=st.trip.doneAt||{}; st.trip.doneAt[arg]=n; st.trip.last=arg; }
      save(); render(); toast("Marked done. Times updated."); break; }
    case "undo": { delete st.trip.status[arg]; if(st.trip.last===arg) st.trip.last=null; save(); render(); break; }
    case "stay": { st.trip.extra[arg]=(st.trip.extra[arg]||0)+15; save(); render(); toast("Added 15 minutes"); break; }
    case "zoom": zoom(arg); break;
    case "copy": { const t=arg; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied "+t)).catch(()=>toast("Dial "+t)); break; }
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="tripDate" && t.value) set({date:t.value});
  if(t.id==="tripStart" && t.value) set({start:t.value});
  if(t.id==="cRain") { st.cond.rain=t.checked; st.cond.rainFromLive=false; st.condManual=Object.assign({},st.condManual,{rain:true}); save(); render(); }
  if(t.id==="cWater") { st.cond.water=t.checked; st.condManual=Object.assign({},st.condManual,{water:true}); save(); render(); }
  if(t.id==="cSurf") { st.cond.surf=t.checked; st.cond.surfFromLive=false; st.condManual=Object.assign({},st.condManual,{surf:true}); save(); render(); }
  if(t.dataset.pack!==undefined){ st.packing[t.dataset.pack]=t.checked; save(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && !$("#sheet").hidden) closeSheet();
  if((e.key==="Enter"||e.key===" ") && e.target.matches("g.mk")){ e.preventDefault(); st.selected=e.target.dataset.sel; save(); render(); const g=document.querySelector(`g.mk[data-sel="${st.selected}"]`); g&&g.focus(); }
});
$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });
$("#historyBtn").addEventListener("click",()=>openSheet(historyHtml()));

// map pan/zoom
let dragMoved=false;
function setVB(){ const svg=$("#mapsvg"); if(svg) svg.setAttribute("viewBox",`${mapVB.x} ${mapVB.y} ${mapVB.w} ${mapVB.h}`); }
function zoom(k){
  if(k==="fit"){ mapVB={x:-10,y:-10,w:380,h:480}; return setVB(); }
  const f=k==="in"?0.7:1/0.7; const cx=mapVB.x+mapVB.w/2, cy=mapVB.y+mapVB.h/2;
  mapVB.w=Math.min(600,Math.max(60,mapVB.w*f)); mapVB.h=mapVB.w*480/380; mapVB.x=cx-mapVB.w/2; mapVB.y=cy-mapVB.h/2; setVB();
}
function bindMap(){
  const svg=$("#mapsvg"); if(!svg) return;
  const box=$("#mapbox"); const ratio=box.clientHeight/box.clientWidth;
  if(Math.abs(mapVB.h/mapVB.w-ratio)>0.01){ const cx=mapVB.x+mapVB.w/2, cy=mapVB.y+mapVB.h/2; if(ratio>480/380){ mapVB.w=Math.max(mapVB.w, 380); mapVB.h=mapVB.w*ratio; } else { mapVB.h=Math.max(mapVB.h,480); mapVB.w=mapVB.h/ratio; } mapVB.x=cx-mapVB.w/2; mapVB.y=cy-mapVB.h/2; setVB(); }
  let start=null, pts=new Map();
  svg.addEventListener("pointerdown",e=>{ pts.set(e.pointerId,[e.clientX,e.clientY]); dragMoved=false; start={x:e.clientX,y:e.clientY,vb:{...mapVB},d:pts.size===2?dist():null}; });
  const dist=()=>{ const [a,b]=[...pts.values()]; return Math.hypot(a[0]-b[0],a[1]-b[1]); };
  svg.addEventListener("pointermove",e=>{
    if(!start||!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    const r=svg.getBoundingClientRect();
    if(pts.size===2 && start.d){ const f=start.d/dist(); const w=Math.min(600,Math.max(60,start.vb.w*f)); const cx=start.vb.x+start.vb.w/2, cy=start.vb.y+start.vb.h/2; mapVB.w=w; mapVB.h=w*start.vb.h/start.vb.w; mapVB.x=cx-w/2; mapVB.y=cy-mapVB.h/2; dragMoved=true; setVB(); return; }
    const dx=(e.clientX-start.x)*mapVB.w/r.width, dy=(e.clientY-start.y)*mapVB.h/r.height;
    if(Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y)>6){ dragMoved=true; if(!svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId); }
    if(dragMoved){ mapVB.x=start.vb.x-dx; mapVB.y=start.vb.y-dy; setVB(); }
  });
  const end=e=>{ pts.delete(e.pointerId); if(pts.size===0){ start=null; setTimeout(()=>dragMoved=false,0); } };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  svg.addEventListener("wheel",e=>{ e.preventDefault(); zoom(e.deltaY<0?"in":"out"); },{passive:false});
}

// refresh day-of projections every minute while open
setInterval(()=>{ if(st.trip.on && $("#sheet").hidden && st.tab==="route"){ const y=window.scrollY; render(); window.scrollTo(0,y); } else if(st.trip.on){ computePlan(); renderNow(); } },60000);
try{ navigator.wakeLock && st.trip.on && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
// ---------- live conditions hook (called by src/main.js) ----------
window.GCC = {
  getState: () => ({date: st.date, dir: st.dir}),
  applyLive(live){
    // live = {rain:boolean|null, surf:boolean|null}; only fills values the person has not set by hand
    st.live = live; let changed=false;
    if(live.ritClosedOn!==undefined){ const v=live.ritClosedOn||null; if(st.cond.ritClosedLive!==v){ st.cond.ritClosedLive=v; changed=true; } }
    for(const k of ["rain","surf"]){ if(live[k]!=null && !(st.condManual||{})[k] && st.cond[k]!==live[k]){ st.cond[k]=live[k]; st.cond[k+"FromLive"]=true; changed=true; } }
    if(changed){ save(); render(); }
  }
};
render();
</script>
