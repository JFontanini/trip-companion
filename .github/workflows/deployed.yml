name: Deployed matches main

# Catches the case no wrapper can: a commit that reached main and never went live.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    # contains(): the variable was pasted from a phone and carries invisible characters
    if: contains(vars.DEPLOY_ENABLED, 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - env:
          LIVE_URL: ${{ vars.LIVE_URL || 'https://guam.techsavvy.dad' }}
        run: bin/check-deployed.sh "$(printf '%s' "$LIVE_URL" | LC_ALL=C tr -cd 'A-Za-z0-9@./:_-')"
