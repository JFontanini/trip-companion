name: Deployed matches main

# Catches the case no wrapper can: a commit that reached main and never went live.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: bin/check-deployed.sh "${{ vars.LIVE_URL || 'https://guam.techsavvy.dad' }}"
