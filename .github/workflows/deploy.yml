name: Deploy

# Push to main = live. Hosting and both rules files ship together, so a rules change can
# never sit committed but undeployed (the gap chief-os-app and catalyst-academy-site hit).
# Cloud Functions deploy by hand from The Beast; see DEPLOY.md.
#
# Keyless, same pattern as chief-os-app: Workload Identity Federation with the repository variables
# in DEPLOY.md. The first step names any variable the run cannot see, instead of skipping silently.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy variables
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          missing=""
          for v in DEPLOY_ENABLED WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT LIVE_URL; do
            val="${!v}"
            if [ -z "$val" ]; then missing="$missing $v"; else echo "$v is set (${#val} characters)"; fi
          done
          if [ -n "$missing" ]; then echo "::error title=Deploy variables missing::Not visible to this run:$missing. Add them under Settings, Secrets and variables, Actions, Variables tab."; exit 1; fi
          if [ "$DEPLOY_ENABLED" != "true" ]; then echo "::error title=Deploy turned off::DEPLOY_ENABLED is set but is not exactly true (${#DEPLOY_ENABLED} characters)."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: python3 bin/check-style.py
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy hosting and rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@13 deploy --only hosting:guam,firestore:rules,storage --project techsavvy-dad --non-interactive

      - name: Verify the live site is this commit
        run: bin/check-deployed.sh "${{ vars.LIVE_URL || 'https://guam.techsavvy.dad' }}"
