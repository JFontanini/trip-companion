name: Deploy

# Push to main = live. Hosting and both rules files ship together, so a rules change can
# never sit committed but undeployed (the gap chief-os-app and catalyst-academy-site hit).
# Cloud Functions deploy by hand from The Beast; see DEPLOY.md.
#
# Off until the Firebase project exists: set repository variable DEPLOY_ENABLED=true after
# the one-time Workload Identity setup in DEPLOY.md. Keyless, same pattern as chief-os-app.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: python3 bin/check-style.py
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy hosting and rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@13 deploy --only hosting:guam,firestore:rules,storage --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Verify the live site is this commit
        run: bin/check-deployed.sh "${{ vars.LIVE_URL || 'https://guam.techsavvy.dad' }}"
